<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f4d"/>
      <stop offset="100%" stop-color="#0a102b"/>
    </linearGradient>
    <linearGradient id="berTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Midnight Navy Luxury Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>

  <!-- Official BER Monogram -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="25">
    <!-- "B" and "E" in Crisp White -->
    <text x="8" y="42" fill="#ffffff" letter-spacing="-0.5px">BE</text>
    <!-- Signature "R" in Vibrant Brand Teal -->
    <text x="40" y="42" fill="url(#berTeal)" filter="url(#glow)">R</text>
  </g>

  <!-- Signature High-Tech Teal Accent Dot -->
  <circle cx="54" cy="18" r="3" fill="#38bdf8" filter="url(#glow)"/>
</svg>
